replicaCount: 3
image:
  repository: healthcare
  tag: latest
  pullPolicy: Never

containerPort: 8000

service:
  type: ClusterIP
  port: 80

config:
  APP_ENV: production
  LOG_LEVEL: info

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 15
  maxReplicas: 30
  targetCPUUtilizationPercentage: 70
vpa:
  enabled: false
  updateMode: "Off"
ingress:
  enabled: true
  host: health.example.com
pdb:
  enabled: true
  minAvailable: 2

redis:
  host: health-redis
  port: 6379
  patientSummaryTTL: 900

database:
  host: health-db.cluster-xxx.us-east-1.rds.amazonaws.com
  port: 5432
  poolsize: 15
  pooltimeout: "3"
  totalpool: 400

env:
  REDIS_HOST: my-cache.xxxxxx.cache.amazonaws.com
  REDIS_PORT: "6379"