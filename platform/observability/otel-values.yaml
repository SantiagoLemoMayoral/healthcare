mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false

  kubernetesAttributes:
    enabled: true

  kubeletMetrics:
    enabled: true

service:
  enabled: true

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8889"

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

config:

  receivers:
    jaeger: null
    zipkin: null

    kubeletstats:
      auth_type: serviceAccount
      endpoint: "${env:K8S_NODE_IP}:10250"
      insecure_skip_verify: true

  exporters:

    prometheus:
      endpoint: 0.0.0.0:8889

    otlphttp/loki:
      endpoint: http://loki-gateway.observability.svc.cluster.local/otlp

    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    pipelines:

      metrics:
        exporters:
          - prometheus

      logs:
        exporters:
          - otlphttp/loki

      traces:
        receivers:
          - otlp
        exporters:
          - otlp/tempo