# healthcare/platform/observability/prometheus-values.yaml

server:
  replicaCount: 1

  # How frequently Prometheus evaluates/scrapes telemetry.
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

  # Minikube / learning environment.
  retention: "24h"

  persistentVolume:
    enabled: true
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    servicePort: 80

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

extraScrapeConfigs: |
  - job_name: "blackbox-healthcare"

    metrics_path: /probe

    params:
      module:
        - http_2xx

    static_configs:
      - targets:
          - http://healthcare.healthcare.svc.cluster.local:80/health

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox.observability.svc.cluster.local:9115

serverFiles:
  alerting_rules.yml:
    groups:
      - name: blackbox
        rules:

          - alert: HelpdeskDown
            expr: probe_success == 0
            for: 1m

            labels:
              severity: critical

            annotations:
              summary: "Helpdesk endpoint is unreachable"