# healthcare/platform/observability/prometheus-values.yaml

server:
  replicaCount: 1

  # How frequently Prometheus evaluates/scrapes telemetry.
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

  # Minikube / learning environment.
  retention: "24h"

  persistentVolume:
    enabled: true
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    servicePort: 80

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true