apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default

spec:
  role: KarpenterNodeRole-healthcare-cluster

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: healthcare-cluster

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: healthcare-cluster